<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Painel gerencial TECK responsivo" />
  <title>Dash TECK</title>
  <style>
    :root {
      --bg: #0f172a;
      --bg-soft: #111827;
      --panel: #0b1220;
      --text: #e2e8f0;
      --muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
      overflow: hidden;
    }

    body {
      display: flex;
      flex-direction: column;
    }

    .frame-shell {
      position: relative;
      width: 100%;
      height: 100vh;
      background: var(--bg);
      overflow: hidden;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      background: var(--panel);
      min-height: 100vh;
    }

    @media (max-width: 768px) {
      html, body {
        overflow: auto;
      }

      .frame-shell {
        height: 100vh;
      }

      iframe {
        min-height: 100vh;
      }
    }

    @media (max-height: 500px) {
      .frame-shell {
        height: 100vh;
      }
    }
  </style>
</head>
<body>
  <div class="frame-shell">
    <iframe
      src="./gemini-code-1792528375368.html"
      title="Painel Gerencial de Projetos - TECK"
      loading="eager"
      allowfullscreen
    ></iframe>
  </div>
</body>
</html>
